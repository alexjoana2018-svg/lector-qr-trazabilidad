<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lector QR - Trazabilidad</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f5f7;

      color: #1f2937;

      min-height: 100vh;

    }


    .contenedor {

      max-width: 600px;

      margin: auto;

      padding: 25px;

    }


    .encabezado {

      background: white;

      padding: 20px;

      border-radius: 10px;

      border: 1px solid #e5e7eb;

      margin-bottom: 20px;

    }


    .encabezado h1 {

      margin: 0;

      font-size: 22px;

    }


    .encabezado p {

      color: #6b7280;

      margin-bottom: 0;

    }


    .panel {

      background: white;

      border: 1px solid #e5e7eb;

      border-radius: 10px;

      padding: 20px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: auto;

    }


    .boton {

      width: 100%;

      border: none;

      border-radius: 7px;

      padding: 14px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      cursor: pointer;

      margin-top: 20px;

    }


    .boton:hover {

      background: #1d4ed8;

    }


    .mensaje {

      margin-top: 20px;

      padding: 15px;

      border-radius: 8px;

      background: #f3f4f6;

      text-align: center;

    }

  </style>


  <!-- LECTOR QR -->

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

</head>


<body>


<div class="contenedor">


  <div class="encabezado">

    <h1>
      📷 Lector QR
    </h1>

    <p>
      Demo de trazabilidad
    </p>

  </div>


  <div class="panel">


    <div id="reader"></div>


    <button
      id="btnIniciar"
      class="boton"
      onclick="iniciarScanner()"
    >
      📷 Iniciar cámara
    </button>


    <div
      id="mensaje"
      class="mensaje"
    >
      Presiona "Iniciar cámara".
    </div>


  </div>


</div>


<script>

let scanner = null;


// ============================================================
// INICIAR ESCÁNER
// ============================================================

function iniciarScanner() {


  const mensaje =
    document.getElementById(
      'mensaje'
    );


  mensaje.textContent =
    'Solicitando acceso a la cámara...';


  scanner =
    new Html5Qrcode(
      'reader'
    );


  scanner.start(

    {
      facingMode: 'environment'
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },


    function(decodedText) {


      console.log(
        'QR detectado:',
        decodedText
      );


      mensaje.textContent =
        '✅ QR detectado: ' +
        decodedText;


      scanner.stop()
        .catch(function(error) {

          console.log(error);

        });

    },


    function(errorMessage) {

      // Ignorar errores normales
      // durante la búsqueda del QR.

    }

  )

  .catch(function(error) {


    console.error(error);


    mensaje.textContent =
      '❌ No fue posible acceder a la cámara.';


    alert(
      'No fue posible acceder a la cámara.\n\n' +
      error
    );

  });

}

</script>


</body>

</html>
